<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>英単語バトル</title><style>*{box-sizing:border-box}body{margin:0;background:#0c1530;color:#fff;font-family:system-ui,sans-serif}main{max-width:520px;margin:auto;padding:22px}h1{font-size:30px}h2{font-size:22px}.card{background:#1b294b;border:1px solid #39496d;border-radius:20px;padding:20px;margin:16px 0}.muted{color:#b7c6e5}input,button{font:inherit;border-radius:12px;padding:13px;width:100%;margin:6px 0}input{background:#fff;border:0;color:#16223a}button{border:0;background:#5be3ae;color:#10233b;font-weight:800;cursor:pointer}button:disabled{opacity:.45}button.alt{background:#34476d;color:white}.choice{background:#e6eeff;color:#18274a;text-align:left}.hide{display:none}.score{display:flex;justify-content:space-between;padding:8px;border-bottom:1px solid #435473}.tag{display:inline-block;padding:6px 10px;background:#34476d;border-radius:20px}.word{font-size:36px;text-align:center;overflow-wrap:anywhere}.center{text-align:center}.error{color:#ffacac}.good{color:#79ffc5}</style></head><body><main><h1>⚡ 英単語バトル</h1><p class="muted">友達とオンライン早押しクイズ！最大8人</p><div id="setup" class="card"><h2>Firebaseに接続中...</h2><p class="muted">少しお待ちください。</p></div><div id="lobby" class="card hide"><h2>オンライン対戦</h2><input id="nickname" maxlength="14" placeholder="ニックネーム"><button id="create">部屋を作る</button><input id="roomCode" maxlength="6" inputmode="numeric" placeholder="6桁のルームコード"><button class="alt" id="join">部屋に参加</button></div><div id="game" class="hide"><div class="card"><div class="center"><span class="tag">ルーム <b id="code"></b></span><p id="status"></p></div><div id="players"></div><button id="start" class="hide">ゲーム開始（ホスト）</button></div><div class="card" id="questionCard"><div class="center muted" id="round"></div><div class="word" id="word"></div><p class="center" id="timer"></p><button id="buzz" class="hide">⚡ 早押し！</button><div id="choices"></div><p id="feedback" class="center"></p></div><button id="leave" class="alt">部屋を抜ける</button></div><p id="notice" class="error"></p></main><script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js';
import {getAuth,signInAnonymously} from 'https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js';
import {getDatabase,ref,set,get,onValue,runTransaction,update,remove,onDisconnect,serverTimestamp} from 'https://www.gstatic.com/firebasejs/11.6.0/firebase-database.js';
const $=id=>document.getElementById(id);const show=(id,yes)=>$(id).classList.toggle('hide',!yes);const bank=[['significant','重要な','一時的な','複雑な','伝統的な'],['achieve','達成する','避ける','失う','選ぶ'],['environment','環境','経済','政府','文化'],['require','必要とする','拒否する','含む','修理する'],['benefit','利益','危険','費用','責任'],['maintain','維持する','破壊する','発見する','借りる'],['opportunity','機会','結果','原因','経験'],['increase','増加する','減少する','交換する','説明する'],['consider','検討する','比較する','完成する','許可する'],['evidence','証拠','方法','目的','意見'],['essential','不可欠な','偶然の','複雑な','正確な'],['consequence','結果','選択','提案','資源'],['approach','取り組み方','利益','習慣','要求'],['establish','設立する','発展する','認識する','交換する'],['available','利用できる','危険な','独立した','十分な'],['improve','改善する','輸入する','印象づける','調査する'],['resource','資源','規則','関係','反応'],['participate','参加する','予測する','保護する','提供する'],['determine','決定する','配達する','依存する','要求する'],['contribute','貢献する','比較する','構成する','集中する']];
let db,auth,uid,code='',unsub=null,isHost=false,room=null,lastRound=-1,clock=null,transitionBusy=false;const msg=t=>$('notice').textContent=t;const rnd=()=>Math.random().toString(36).slice(2);function nick(){return $('nickname').value.trim().slice(0,14)||'プレイヤー'}function makeQuestions(){return [...bank].sort(()=>Math.random()-.5).slice(0,10).map(a=>{let options=a.slice(1).map((text,i)=>({text,correct:i===0}));for(let i=options.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[options[i],options[j]]=[options[j],options[i]]}return {word:a[0],options}})}
const firebaseConfig={apiKey:"AIzaSyDQ2Ot4P9sFJJzlM2BgKUsjDf2k9J2-aqs",authDomain:"english-battle-f2329.firebaseapp.com",databaseURL:"https://english-battle-f2329-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"english-battle-f2329",storageBucket:"english-battle-f2329.firebasestorage.app",messagingSenderId:"46391994381",appId:"1:46391994381:web:087bc7f0228fad56c08d44",measurementId:"G-NPV8QNLXDL"};
async function connect(){const app=initializeApp(firebaseConfig);db=getDatabase(app);auth=getAuth(app);await signInAnonymously(auth);uid=auth.currentUser.uid;show('setup',false);show('lobby',true)}
connect().catch(e=>{document.querySelector('#setup h2').textContent='接続できませんでした';document.querySelector('#setup p').textContent='Firebaseの匿名認証・ルールとネット接続を確認してください。エラー: '+e.message;msg(e.message)});
async function enter(c,host){code=c;isHost=host;show('lobby',false);show('game',true);$('code').textContent=code;let pr=ref(db,`rooms/${code}/players/${uid}`);await onDisconnect(pr).remove();unsub=onValue(ref(db,`rooms/${code}`),snap=>{room=snap.val();if(!room){msg('部屋が終了しました');exitLocal();return}render()});}
$('create').onclick=async()=>{try{msg('');let c;for(let i=0;i<8;i++){c=String(Math.floor(100000+Math.random()*900000));if(!(await get(ref(db,'rooms/'+c))).exists())break}let data={host:uid,phase:'waiting',round:0,players:{[uid]:{name:nick(),score:0}},questions:makeQuestions(),createdAt:Date.now()};await set(ref(db,'rooms/'+c),data);await enter(c,true)}catch(e){msg(e.message)}};
$('join').onclick=async()=>{try{msg('');let c=$('roomCode').value.trim();if(!/^\d{6}$/.test(c))throw Error('6桁のコードを入力してください');let result=await runTransaction(ref(db,'rooms/'+c),r=>{if(!r||r.phase!=='waiting'||!r.players||Object.keys(r.players).length>=8)return; r.players[uid]={name:nick(),score:0};return r},{applyLocally:false});if(!result.committed)throw Error('部屋がない、開始済み、または満員です');await enter(c,false)}catch(e){msg(e.message)}};
$('start').onclick=async()=>{if(!isHost||!room||room.phase!=='waiting')return;await update(ref(db,'rooms/'+code),{phase:'question',round:0,deadline:Date.now()+10000,buzz:null,feedback:null})};
$('buzz').onclick=async()=>{if(!room||room.phase!=='question')return;await runTransaction(ref(db,`rooms/${code}/buzz`),v=>v===null?{uid,at:Date.now()}:undefined,{applyLocally:false})};
async function answer(index){if(!room||room.phase!=='question'||room.buzz?.uid!==uid)return;let q=room.questions[room.round],correct=q.options[index].correct;let result=await runTransaction(ref(db,`rooms/${code}`),r=>{if(!r||r.phase!=='question'||r.buzz?.uid!==uid||r.feedback)return;let ok=r.questions[r.round].options[index].correct;r.players[uid].score=(r.players[uid].score||0)+(ok?100:-50);r.feedback={uid,correct:ok,answer:r.questions[r.round].options.find(o=>o.correct).text};r.phase='feedback';r.deadline=Date.now()+2200;return r},{applyLocally:false});}
function render(){if(!room)return;let players=Object.entries(room.players||{}).sort((a,b)=>(b[1].score||0)-(a[1].score||0));$('players').innerHTML='';players.forEach(([id,p],i)=>{let d=document.createElement('div');d.className='score';d.textContent=`${i+1}位 ${p.name}${id===uid?'（あなた）':''}　${p.score||0}点`;$('players').append(d)});$('status').textContent=room.phase==='waiting'?`待機中 ${players.length}/8人：友達にコードを共有`:room.phase==='finished'?'🏆 対戦終了！':'対戦中';show('start',isHost&&room.phase==='waiting'&&players.length>=2);let q=room.questions?.[room.round];$('round').textContent=room.phase==='waiting'?'開始を待っています':room.phase==='finished'?'最終結果':`第 ${room.round+1} / 10 問`;$('word').textContent=room.phase==='finished'?'FINISH':room.phase==='waiting'?'READY':q?.word||'';show('buzz',room.phase==='question'&&!room.buzz);$('buzz').disabled=!!room.buzz;$('choices').innerHTML='';if(room.phase==='question'&&room.buzz?.uid===uid){q.options.forEach((o,i)=>{let b=document.createElement('button');b.className='choice';b.textContent=`${'ABCD'[i]}. ${o.text}`;b.onclick=()=>answer(i);$('choices').append(b)})}$('feedback').textContent=room.phase==='feedback'?`${room.feedback?.correct?'正解！':'不正解！'} 正解：${room.feedback?.answer}`:room.buzz?`${room.players?.[room.buzz.uid]?.name||'誰か'}が回答中`:(room.phase==='question'?'早押しボタンを押そう！':'');if(room.phase==='finished')$('feedback').textContent=`優勝：${players[0]?.[1].name||''}`;}
async function tick(){if(!room||!code)return;let remain=Math.max(0,(room.deadline||0)-Date.now());$('timer').textContent=['question','feedback'].includes(room.phase)?`残り ${(remain/1000).toFixed(1)} 秒`:'';if(!isHost||transitionBusy||remain>0)return;transitionBusy=true;try{if(room.phase==='question'){await runTransaction(ref(db,'rooms/'+code),r=>{if(!r||r.phase!=='question'||r.deadline>Date.now())return;let q=r.questions[r.round];r.phase='feedback';r.feedback={correct:false,answer:q.options.find(o=>o.correct).text};r.deadline=Date.now()+2200;return r},{applyLocally:false})}else if(room.phase==='feedback'){await runTransaction(ref(db,'rooms/'+code),r=>{if(!r||r.phase!=='feedback'||r.deadline>Date.now())return;r.round++;r.phase=r.round>=10?'finished':'question';r.buzz=null;r.feedback=null;r.deadline=Date.now()+10000;return r},{applyLocally:false})}}catch(e){msg(e.message)}finally{transitionBusy=false}}clock=setInterval(tick,150);
function exitLocal(){if(unsub){unsub();unsub=null}code='';room=null;show('game',false);show('lobby',true)}$('leave').onclick=async()=>{if(!code)return;let c=code;exitLocal();try{if(isHost)await remove(ref(db,'rooms/'+c));else await remove(ref(db,`rooms/${c}/players/${uid}`))}catch(e){msg(e.message)}};
</script></body></html>
